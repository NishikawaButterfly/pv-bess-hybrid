version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      scientific:
        patterns:
          - numpy
          - scipy
      dev-tools:
        patterns:
          - build
          - coverage
          - httpx
          - mypy
          - pip-audit
          - ruff
          - twine
      api-server:
        patterns:
          - fastapi
          - python-multipart
          - uvicorn
