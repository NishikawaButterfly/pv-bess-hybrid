name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked direct dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check -r requirements-api.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check

      - name: Check formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy src

      - name: Test with branch coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          pv-bess validate --scenario sample-data/scenario.json

      - name: Audit runtime dependencies
        run: pip-audit --requirement requirements.txt --requirement requirements-api.txt

  windows-smoke:
    name: Windows smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install and verify
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pip check
          python -m unittest discover -s tests -v
          pv-bess validate --scenario sample-data/scenario.json
