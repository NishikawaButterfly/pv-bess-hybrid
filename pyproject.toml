[build-system]
requires = ["setuptools==83.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-bess-hybrid"
version = "0.1.0"
description = "Auditable PV and battery dispatch and investment-analysis kernel"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NishikawaButterfly" }]
keywords = ["battery", "bess", "dispatch", "energy", "optimization", "photovoltaic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
]

[project.urls]
Homepage = "https://github.com/NishikawaButterfly/pv-bess-hybrid"
Repository = "https://github.com/NishikawaButterfly/pv-bess-hybrid"
Issues = "https://github.com/NishikawaButterfly/pv-bess-hybrid/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "ruff>=0.9,<1",
  "twine>=6,<7",
]

[project.scripts]
pv-bess = "pv_bess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pv_bess = ["py.typed"]

[tool.coverage.run]
branch = true
source = ["pv_bess"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PERF", "RUF", "SIM", "UP"]
